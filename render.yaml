databases:
  - name: meshi-log-db
    databaseName: meshi_log
    user: meshi_log

services:
  - type: web
    name: meshi-log
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meshi-log-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false